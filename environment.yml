name: mobster
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - isescan=1.7.3          # pinned: output layout/filenames differ across versions (spec §4.2)
  - minimap2=2.28
  - pysam>=0.22
  - biopython>=1.84
  - pandas>=2.0
  - coloredlogs
  - pytest
  - breseq=0.39.0          # gdtools, for benchmark simulation (spec §8)
  - pip
